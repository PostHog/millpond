name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

    - name: Format check
      run: uv run ruff format --check millpond/

    - name: Lint
      run: uv run ruff check millpond/

    - name: Unit tests
      run: uv run pytest -m "not integration and not e2e"

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
      with:
        fail-on-severity: moderate
        # SPDX atoms our transitive deps actually declare. Notes:
        #   Python-2.0  — canonical SPDX id for the PSF License (pyparsing uses this form)
        #   PSF-2.0     — informal alias for the same license (greenlet, typing_extensions use this form)
        #   MPL-2.0     — certifi, and the MPL portion of orjson's "MPL-2.0 AND (Apache-2.0 OR MIT)"
        # SPDX `AND` is conjunction: every atom in an expression must be on this list.
        allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, Python-2.0, PSF-2.0, MPL-2.0

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Build Docker image
      run: docker build --build-arg MILLPOND_VERSION=0.0.0.dev0 -t millpond .

  integration:
    # Integration suite: MinIO + iceberg-rest via testcontainers. No Kafka,
    # no millpond container — drives the library directly. ~10s runtime.
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

    - name: Integration tests
      run: uv run pytest tests/integration -v

  e2e:
    # E2E suites: full docker-compose stacks for both destinations.
    # Each builds the millpond image, brings up Kafka/MinIO/(Postgres|iceberg-rest),
    # runs the producer, and verifies records land. ~1 minute per stack.
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: ducklake, path: tests/e2e/test_e2e.py }
          - { name: iceberg,  path: tests/e2e/test_e2e_iceberg.py }
    name: e2e (${{ matrix.suite.name }})
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

    - name: E2E tests
      run: uv run pytest ${{ matrix.suite.path }} -v -s
