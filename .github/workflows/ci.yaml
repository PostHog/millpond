name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

    - name: Format check
      run: uv run ruff format --check millpond/

    - name: Lint
      run: uv run ruff check millpond/

    - name: Unit tests
      run: uv run pytest -m "not integration and not e2e"

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
      with:
        fail-on-severity: moderate
        # SPDX atoms our transitive deps actually declare. Notes:
        #   Python-2.0  — canonical SPDX id for the PSF License (pyparsing uses this form)
        #   PSF-2.0     — informal alias for the same license (greenlet, typing_extensions use this form)
        #   MPL-2.0     — certifi, and the MPL portion of orjson's "MPL-2.0 AND (Apache-2.0 OR MIT)"
        # SPDX `AND` is conjunction: every atom in an expression must be on this list.
        allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, Python-2.0, PSF-2.0, MPL-2.0
        # Packages whose license metadata uses PEP 639 (License-Expression
        # field) that the dependency-review action's parser doesn't
        # currently understand, so it reports "could not detect a
        # license" and fails the check even when the actual SPDX
        # expression is in our allow-list above. We whitelist by purl
        # for the specific packages we know are fine:
        #   - googleapis-common-*  Apache-2.0
        #   - opentelemetry-*      Apache-2.0
        #   - protobuf             BSD-3-Clause
        #   - pyducklake           Apache-2.0 (ours; PEP 639-only metadata)
        # Substantive (non-parser) exemptions:
        #   - psycopg, psycopg-binary  LGPL family: we link, don't modify;
        #     LGPL terms are satisfied — PostHog-cloud-infra precedent,
        #     mirrored from viaduck's ci.yaml.
        # Remove entries here as the action's PEP 639 parser catches up
        # (parser-noise entries only; the LGPL exemption is permanent).
        allow-dependencies-licenses: >-
          pkg:pypi/pyducklake,
          pkg:pypi/googleapis-common-protos,
          pkg:pypi/opentelemetry-api,
          pkg:pypi/opentelemetry-exporter-otlp-proto-common,
          pkg:pypi/opentelemetry-exporter-otlp-proto-http,
          pkg:pypi/opentelemetry-proto,
          pkg:pypi/opentelemetry-sdk,
          pkg:pypi/opentelemetry-semantic-conventions,
          pkg:pypi/protobuf,
          pkg:pypi/psycopg,
          pkg:pypi/psycopg-binary

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Build Docker image
      run: docker build --build-arg MILLPOND_VERSION=0.0.0.dev0 -t millpond .

  integration:
    # Integration suite: ducklake.write() + SchemaManager against
    # in-memory DuckDB (no containers, ~10s), then the hoglake sink
    # against a REAL hoglake server on the throwaway compose stack.
    runs-on: ubuntu-latest
    needs: check
    env:
      # Makes an unavailable stack a FAILURE instead of a skip. Without
      # it, a Docker hiccup or an unpullable image turns this job's only
      # real-server coverage into a green tick that proves nothing.
      # Unset locally, so a laptop with no Docker still runs the rest.
      MILLPOND_REQUIRE_DOCKER_STACK: "1"
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

    - name: Integration tests (DuckLake, in-memory)
      run: uv run pytest tests/integration --ignore=tests/integration/test_hoglake_integration.py -v

    - name: Integration tests (hoglake, real server)
      run: uv run pytest tests/integration/test_hoglake_integration.py -v

  e2e:
    # Full docker-compose stacks: the DuckLake one builds the millpond
    # image and brings up Kafka/MinIO/Postgres; the hoglake one runs
    # millpond's real entry point against a hoglake server. Both verify
    # records land. ~3 minutes.
    runs-on: ubuntu-latest
    needs: check
    env:
      MILLPOND_REQUIRE_DOCKER_STACK: "1"
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

    - name: E2E tests (DuckLake)
      run: uv run pytest tests/e2e/test_e2e.py -v -s

    - name: E2E tests (hoglake)
      run: uv run pytest tests/e2e/test_hoglake_e2e.py -v -s
