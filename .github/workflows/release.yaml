name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    # Only run in the canonical repo — forks must not push images, tags,
    # or deployment dispatches.
    if: github.repository == 'PostHog/millpond'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        fetch-depth: 0  # need full history for changelog and tag lookup

    - name: Get latest tag
      id: latest_tag
      run: |
        tag=$(git tag --sort=-v:refname | head -1 || echo "v0.0.0")
        [ -z "$tag" ] && tag="v0.0.0"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Bump patch version
      id: next_tag
      env:
        CURRENT_TAG: ${{ steps.latest_tag.outputs.tag }}
      run: |
        version="${CURRENT_TAG#v}"
        IFS='.' read -r major minor patch <<< "$version"
        next="v${major}.${minor}.$((patch + 1))"
        echo "tag=$next" >> "$GITHUB_OUTPUT"
        echo "version=${next#v}" >> "$GITHUB_OUTPUT"

    - name: Generate changelog
      id: changelog
      env:
        PREV_TAG: ${{ steps.latest_tag.outputs.tag }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        {
          echo "body<<CHANGELOG_EOF"
          echo "## Changes"
          echo ""
          if [ "$PREV_TAG" = "v0.0.0" ]; then
            git log --pretty=format:"- %s (%h)" HEAD
          else
            git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD"
          fi
          echo ""
          echo ""
          echo "---"
          echo "**Commit:** ${COMMIT_SHA}"
          echo "**Author:** $(git log -1 --pretty=format:'%an')"
          echo "CHANGELOG_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Build release tarball
      env:
        NEXT_TAG: ${{ steps.next_tag.outputs.tag }}
        NEXT_VERSION: ${{ steps.next_tag.outputs.version }}
      run: |
        # Write version file for reference — tarball consumers use
        # SETUPTOOLS_SCM_PRETEND_VERSION at install time, which generates the
        # full hatch-vcs _version.py with __version_tuple__ etc.
        echo "__version__ = \"${NEXT_VERSION}\"" > millpond/_version.py
        # git archive doesn't include untracked files, so use tar directly
        tar czf "millpond-${NEXT_TAG}.tar.gz" \
          --transform "s,^,millpond-${NEXT_TAG}/," \
          --exclude='.git' --exclude='*.pyc' --exclude='__pycache__' \
          --exclude='.venv' --exclude='.flox' \
          pyproject.toml uv.lock LICENSE README.md Dockerfile \
          millpond/ tests/ test/

    # Build and push Docker image before creating the release —
    # if the image fails, we don't end up with an orphaned release/tag.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

    - name: Log in to GHCR
      uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          MILLPOND_VERSION=${{ steps.next_tag.outputs.version }}
        tags: |
          ghcr.io/posthog/millpond:${{ steps.next_tag.outputs.tag }}
          ghcr.io/posthog/millpond:${{ github.sha }}
          ghcr.io/posthog/millpond:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # --- Deploy: pin the pushed image by digest in PostHog/charts ---
    # The production deployment must not follow mutable tags (:prod,
    # :latest). Instead we record the manifest digest of the image built
    # here in the charts state file (state/millpond.yaml) via a
    # repository_dispatch. ArgoCD then rolls the pinned
    # <commit>@sha256:<digest> reference with prod-approval gating.
    # The :latest / :prod tag pushes above stay for back-compat until the
    # charts-side cutover lands.

    - name: Get image digest
      id: digest
      run: |
        digest=$(docker buildx imagetools inspect --raw ghcr.io/posthog/millpond:${{ github.sha }} | sha256sum | awk '{print "sha256:"$1}')
        echo "digest=${digest}" >> "$GITHUB_OUTPUT"

    - name: Get deployer token
      id: deployer
      uses: getsentry/action-github-app-token@d4b5da6c5e37703f8c3b3e43abb5705b46e159cc # v3.0.0
      with:
        app_id: ${{ secrets.GH_APP_CHARTS_DEPLOYER_APP_ID }}
        private_key: ${{ secrets.GH_APP_CHARTS_DEPLOYER_PRIVATE_KEY }}

    - name: Trigger deployment via Charts repo
      uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
      with:
        token: ${{ steps.deployer.outputs.token }}
        repository: PostHog/charts
        event-type: commit_state_update
        client-payload: |
          {
            "values": {
              "image": {
                "sha": "${{ github.sha }}@${{ steps.digest.outputs.digest }}"
              }
            },
            "release": "millpond",
            "commit": ${{ toJson(github.event.head_commit) }},
            "repository": ${{ toJson(github.repository) }},
            "labels": [],
            "timestamp": "${{ github.event.head_commit.timestamp }}"
          }

    - name: Create git tag
      env:
        NEXT_TAG: ${{ steps.next_tag.outputs.tag }}
      run: |
        git tag "$NEXT_TAG"
        git push origin "$NEXT_TAG"

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NEXT_TAG: ${{ steps.next_tag.outputs.tag }}
        COMMIT_SHA: ${{ github.sha }}
        CHANGELOG_BODY: ${{ steps.changelog.outputs.body }}
      run: |
        gh release create "$NEXT_TAG" \
          --title "${NEXT_TAG} (${COMMIT_SHA})" \
          --notes "$CHANGELOG_BODY" \
          "millpond-${NEXT_TAG}.tar.gz"
