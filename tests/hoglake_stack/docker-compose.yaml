# Throwaway hoglake stack for millpond's hoglake integration/e2e tests.
#
# ALWAYS run under the compose project name `millpond-hog-it` (the test
# fixtures do) and NEVER on the hoglake dev stack's default ports
# (8080/9000/9001/5432/5173) — every published port here is a high port
# bound to 127.0.0.1 so this stack can coexist with a live hoglake dev
# environment on the same machine.
#
# Server image: HOGLAKE_SERVER_IMAGE, and it is REQUIRED (`:?`) rather
# than defaulted. tests/hoglake_stack/stack.py sets it from DEFAULT_IMAGE
# — a pinned multi-arch digest — on every compose call, and an operator
# overrides it in the environment to run against a locally built server
# (e.g. an image from a hoglake checkout's server/Dockerfile).
#
# It used to default to `:latest`, and that default silently WON: the
# only thing stack.py did with DEFAULT_IMAGE was `docker pull` it, so
# the digest was downloaded and the container ran whatever `:latest`
# resolved to locally. These suites are contract tests — a stale
# `:latest` means they assert a server nobody chose, and a green run
# proves nothing. Mandatory here so a bare `docker compose up` in this
# directory fails loudly instead of resurrecting the old behaviour.
#
# The `e2e` profile adds a single-node KRaft Kafka for the end-to-end
# pipeline test; the integration tests don't boot it.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hoglake
      POSTGRES_USER: hoglake
      POSTGRES_PASSWORD: hoglake
    ports:
      - "127.0.0.1:25432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoglake"]
      interval: 2s
      timeout: 2s
      retries: 15

  minio:
    # cgr.dev/chainguard: quay.io now refuses anonymous pulls of
    # minio/minio (401). Same entrypoint, and mc is in the image.
    image: cgr.dev/chainguard/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: hoglake
      MINIO_ROOT_PASSWORD: hoglake123
    ports:
      - "127.0.0.1:29000:9000"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 15

  hoglake-server:
    image: ${HOGLAKE_SERVER_IMAGE:?set by tests/hoglake_stack/stack.py (DEFAULT_IMAGE, or your own override)}
    environment:
      HOGLAKE_INSTANCE_NAME: millpond-hog-it
      HOGLAKE_JDBC_URL: jdbc:postgresql://postgres:5432/hoglake
      HOGLAKE_DB_USER: hoglake
      HOGLAKE_DB_PASSWORD: hoglake
      HOGLAKE_S3_ENDPOINT: http://minio:9000
      HOGLAKE_S3_ACCESS_KEY: hoglake
      HOGLAKE_S3_SECRET_KEY: hoglake123
      # Keep the stack deterministic: no background compaction rewriting
      # files while a test is counting them.
      HOGLAKE_COMPACTION_INTERVAL_MS: "0"
    ports:
      - "127.0.0.1:28080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  kafka:
    profiles: ["e2e"]
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      # Empty-host listener form, per the apache/kafka image's own
      # compose examples — the docker wrapper's storage-format step
      # rejects 0.0.0.0 outright.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:29092:29092"
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
      interval: 5s
      timeout: 10s
      retries: 12
