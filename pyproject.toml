[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "millpond/_version.py"

[project]
name = "millpond"
dynamic = ["version"]
description = "Kafka to DuckLake or Iceberg"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6",
    # Pinned exactly. 1.5.2 is the DuckDB release that ships DuckLake 1.0,
    # the breaking-change rev of the ducklake extension that millpond/ducklake.py
    # has been aligned against. The DuckLake 1.x line is pre-stable, and the
    # extension repository does not expose installable version specifiers for
    # ducklake — INSTALL ducklake VERSION '...' returns 404. To compensate,
    # tests/unit/test_ducklake_pin.py asserts the build SHA of the loaded
    # extension as a drift canary. Bumping this DuckDB pin (or letting the
    # extension SHA move) requires updating that canary explicitly.
    "duckdb==1.5.2",
    "pyarrow>=18.0",
    "orjson>=3.10",
    "prometheus-client>=0.21",
    # Required by duckdb's Python conversion for TIMESTAMPTZ columns; the
    # stdlib zoneinfo module isn't accepted as a substitute as of 1.4.x.
    "pytz>=2024.1",
    "pyyaml>=6.0.3",
    # Pinned exactly. millpond/iceberg.py depends on two private symbols
    # (_pyarrow_to_schema_without_ids, assign_fresh_schema_ids) and PyIceberg
    # is pre-1.0 — minor-version bumps reshuffle internals. The canary test
    # tests/unit/test_pyiceberg_pin.py imports both and will fail loudly on
    # any upgrade; treat that as the signal to revisit this module.
    "pyiceberg[pyarrow]==0.11.1",
    "asyncpg>=0.30",
    "psycopg[binary,pool]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    # OpenTelemetry SDK + HTTP OTLP log exporter. The icebox uses this
    # to ship structured logs to PostHog Logs when
    # POSTHOG_PROJECT_TOKEN is set. PostHog terminates standard OTLP/HTTP
    # at /i/v1/logs — no PostHog-specific Python package exists.
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[project.optional-dependencies]
msk-iam = ["aws-msk-iam-sasl-signer-python>=1.0.0"]

[project.scripts]
millpond = "millpond.main:main"
icebox = "icebox.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.8",
    "sqlalchemy>=2.0.49",
    "testcontainers>=4.14.2",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "e2e: marks tests as E2E tests requiring docker-compose stack",
    "stress: characterisation tests that drive a docker-compose stack under contention (manual, not run in CI)",
]
pythonpath = ["tools"]
testpaths = ["tests"]
# Keep collection scoped to `tests/` only — the repo also contains a
# cloned `lakekeeper/` source tree for cross-reference, and its own
# tests/ import deps (pydantic_settings, etc.) we don't carry.
norecursedirs = ["lakekeeper", ".venv", "node_modules"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
    "pygments>=2.20.0",
    "requests>=2.33.0",
]
