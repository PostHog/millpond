[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "millpond/_version.py"

[project]
name = "millpond"
dynamic = ["version"]
description = "Kafka to DuckLake"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6",
    # Pinned exactly, and matched to pyducklake's own duckdb pin. The DuckDB
    # version selects the ducklake extension channel: 1.5.2's channel is
    # frozen at build 415a9ebd (2026-04-09), whose per-connection
    # stats/schemas caches grow unbounded as catalog snapshots advance —
    # the leak that OOM-killed viaduck every 4-6h (A/B-verified there:
    # 415a9ebd leaks ~1MiB per snapshot-advancing bind; the 1.5.5-channel
    # build is flat). The DuckLake 1.x line is pre-stable, and the extension
    # repository does not expose installable version specifiers for
    # ducklake — INSTALL ducklake VERSION '...' returns 404. To compensate,
    # tests/unit/test_ducklake_pin.py asserts the build SHA of the loaded
    # extension as a drift canary. Bumping this DuckDB pin (or letting the
    # extension SHA move) requires updating that canary explicitly.
    # The image overwrites this PyPI wheel with PostHog/duckdb
    # v1.5.5-posthog.5 so VARIANT shred allowlist settings exist; the
    # Dockerfile asserts that fork's source_id.
    "duckdb==1.5.5",
    # Our DuckLake Python API (jghoman/pyducklake). Nothing imports it yet —
    # it is here as a deliberate lockstep canary: pyducklake hard-pins its
    # duckdb version (==1.5.5 as of 1.0.17, the first release on the safe
    # extension channel above), so a future bump of either duckdb or
    # pyducklake that the other hasn't matched makes `uv lock` unresolvable
    # instead of silently splitting the two DuckLake stacks. Adoption of the
    # API itself comes later.
    "pyducklake>=1.0.17",
    "pyarrow>=18.0",
    "orjson>=3.10",
    "prometheus-client>=0.21",
    # Required by duckdb's Python conversion for TIMESTAMPTZ columns; the
    # stdlib zoneinfo module isn't accepted as a substitute as of 1.4.x.
    "pytz>=2024.1",
    "pyyaml>=6.0.3",
    # OpenTelemetry SDK + HTTP OTLP log exporter. Ships structured logs
    # to PostHog Logs when POSTHOG_PROJECT_TOKEN is set. PostHog
    # terminates standard OTLP/HTTP at /i/v1/logs — no PostHog-specific
    # Python package exists.
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    # 1.42 deprecated opentelemetry.sdk._logs.LoggingHandler in favor of the
    # one shipped from opentelemetry-instrumentation-logging. Same API,
    # same wire behavior, just no DeprecationWarning at construction.
    # Ceiling is to bound surprise — the instrumentation contrib packages
    # have moved module paths across minor revs before (the handler lives
    # at opentelemetry.instrumentation.logging.handler today; that's NOT
    # the package's documented public surface — public is
    # LoggingInstrumentor — so a future rev could move it without a
    # deprecation cycle. Bump deliberately.
    "opentelemetry-instrumentation-logging>=0.50b0,<0.64",
]

[project.optional-dependencies]
msk-iam = ["aws-msk-iam-sasl-signer-python>=1.0.0"]

[project.scripts]
millpond = "millpond.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.8",
    "testcontainers>=4.14.2",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "e2e: marks tests as E2E tests requiring docker-compose stack",
]
pythonpath = ["tools"]
testpaths = ["tests"]
# Keep collection scoped to `tests/` only — local working clones (e.g.
# an untracked `lakekeeper/` source tree) carry their own tests/ whose
# deps we don't install.
norecursedirs = ["lakekeeper", ".venv", "node_modules"]

[tool.uv]
exclude-newer = "7 days"
# Cooldown carve-out for our own package (jghoman/pyducklake): 1.0.17 was
# published 2026-08-13 and is needed now for the safe ducklake extension
# channel. Fixed date, not a rolling window — future pyducklake releases
# re-enter the cooldown until this date is bumped alongside an intentional
# version bump.
exclude-newer-package = { pyducklake = "2026-08-14T00:00:00Z" }
constraint-dependencies = [
    "pygments>=2.20.0",
    "requests>=2.33.0",
]
