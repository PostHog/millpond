[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "millpond/_version.py"

[project]
name = "millpond"
dynamic = ["version"]
description = "Kafka to DuckLake"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6",
    # Pinned exactly. The DuckDB version selects the ducklake extension
    # channel: 1.5.2's channel is
    # frozen at build 415a9ebd (2026-04-09), whose per-connection
    # stats/schemas caches grow unbounded as catalog snapshots advance —
    # the leak that OOM-killed viaduck every 4-6h (A/B-verified there:
    # 415a9ebd leaks ~1MiB per snapshot-advancing bind; the 1.5.5-channel
    # build is flat). The DuckLake 1.x line is pre-stable, and the extension
    # repository does not expose installable version specifiers for
    # ducklake — INSTALL ducklake VERSION '...' returns 404. To compensate,
    # tests/unit/test_ducklake_pin.py asserts the build SHA of the loaded
    # extension as a drift canary. Bumping this DuckDB pin (or letting the
    # extension SHA move) requires updating that canary explicitly.
    "duckdb==1.5.5",
    # Hoglake destination client: owns the writer path (parquet with field
    # ids, footer-stat extraction, registration via footer-shipping
    # commits). 1.1.0 brought partitioned fanout appends and the atomic
    # expected_table_uuid commit guard, both of which the HoglakeSink
    # relies on. 1.1.1 stamps `uploaded_files` and `uploaded_uris` on every
    # exception leaving `prepare_append_files` — the difference between
    # millpond counting the orphans of a failed prepare and guessing at
    # them. 1.3.0 is the floor because `coltype_to_arrow("uuid")` finally
    # answers `pa.uuid()` rather than a bare `fixed_size_binary(16)`: the
    # schema HoglakeSink._prepare casts the batch to is what decides
    # whether the uploaded parquet carries `LogicalTypeAnnotation.uuidType()`,
    # and an Iceberg reader (the Trino hoglake connector among them) binds a
    # uuid column through that annotation. 1.3.0 also accepts BOTH spellings
    # on append, so a mixed fleet writing either one keeps working.
    # 1.3.7 is the floor now, for the flush path's shape rather than for a
    # type: `prepare_append_tables` encodes each already-partitioned Arrow
    # table straight to a buffer (no temp file to write, fsync, re-read for
    # the footer and re-read for the upload), uploads the buffers
    # CONCURRENTLY, and returns the same commit request the file path
    # returns for the same rows. With it come the typed non-retryable
    # commit refusals the sink now reads instead of re-reading the table
    # before every commit — `ddl_since_read_snapshot`
    # (DdlSinceReadSnapshotError), `table_recreated`
    # (IncarnationChangedError), `ReadSnapshotExpiredError` — plus
    # `Table.info(totals=False)`, which skips a count and two sums over
    # every live file row of the table on a read the writer makes for the
    # uuid, the columns and the specs and has never read a total from.
    # The `fast-upload` EXTRA pulls boto3 in: pyarrow's S3 output stream
    # always opens a multipart upload (CreateMultipartUpload + UploadPart +
    # CompleteMultipartUpload, three round trips for a 12 KiB file), and
    # with boto3 present pyhoglake puts anything at or under 8 MiB up as a
    # single `PutObject` instead. A partitioned flush is hundreds of small
    # files, so that is the difference between ~3 and ~1 requests each,
    # fanned out 64-wide rather than serial. Without the extra pyhoglake
    # logs a warning and falls back to the streaming path, which is a
    # silent 3x on the writer's dominant cost — hence the extra is part of
    # the dependency spec and not left to the deployment to remember.
    # 1.4.0 adds `author` / `message` to every DDL call. The sink passes
    # both on catalog, namespace and table creation and on every alter,
    # and an older client refuses the keywords outright (TypeError), so
    # this is a floor, not a preference.
    # 1.4.4 adds `compression=` / `compression_level=` on
    # `prepare_append_tables` and `parquet_write_options`. The sink passes
    # the codec on every flush and config.load() validates through
    # `parquet_write_options`, so an older client fails the pod at start
    # (ImportError) — also a floor.
    # 1.4.5 adds `deferred_stats=` on `prepare_append_tables` and the
    # typed `IdlessFilesPresentError` for the add/rename refusal it
    # implies. The alter path catches that type by name (an ImportError at
    # start on an older client) and config.load() refuses a client whose
    # prepare_append_tables lacks the keyword — a floor. 1.4.6 documents
    # the hoglake SERVER 1.4.6 narrowing of that refusal to a PROVEN
    # id-less file, which the sink treats as permanent; the server
    # version itself is a deployment requirement no client floor checks.
    # 1.4.8 is the floor for VARIANT: `prepare_append_tables` encodes a
    # `pa.json_()` column into a live `variant` column's declared shredded
    # layout (`write_part`), takes `variant_on_invalid=` and
    # `variant_report=`, and `columns_to_arrow_schema(columns,
    # variant="json")` builds the target schema the sink casts to. An
    # older client raises `UnsupportedTypeError` on the first variant
    # column, so this is a floor. The `variant-codec` EXTRA pulls the Rust
    # codec (pyhoglake-variant-codec, prebuilt wheels for linux
    # x86_64/aarch64 and macOS, which is what the image and laptops are);
    # pyhoglake picks it up by itself (`PYHOGLAKE_VARIANT_CODEC=auto`) and
    # falls back to its Python codec where the wheel is absent. Without the
    # extra every variant row encodes in Python: measured on the whales
    # shape (~13.8 KB/row, seven variant columns, M4 Pro) the Rust codec
    # is ~27 us/row and the Python encoder ~172 us/row, 6-10x, on the
    # flush thread — a 2 GiB flush goes from seconds to over a minute of
    # consume pause, and more on prod's Graviton (est. 1.8-2.5x slower per
    # core). The same "silent 3x" posture as fast-upload, so it is part of
    # the dependency spec, the image asserts it, and the sink refuses to
    # resolve a variant table with a process that resolved to Python
    # (MILLPOND_ALLOW_PYTHON_VARIANT_CODEC).
    "pyhoglake[fast-upload,variant-codec]>=1.4.8",
    # 26 because pyhoglake 1.4.8 requires it (its own floor for the VARIANT
    # writer is 23: pyarrow 21 cannot open a file with a VARIANT group, and
    # 21/22 cannot read the stats of an INT32/INT64 DECIMAL leaf). Declared
    # here rather than left to resolve transitively: millpond imports
    # pyarrow directly on every path, so its floor is millpond's business
    # to state.
    "pyarrow>=26.0.0",
    "orjson>=3.10",
    # Direct libpq for the drop-partitions maintenance op (postgres_execute
    # imposes REPEATABLE READ, returns no result sets, and its duckdb
    # teardown core-dumps after success). Same dependency and floor as
    # viaduck, whose state store we read for the cursor guard.
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.21",
    # Required by duckdb's Python conversion for TIMESTAMPTZ columns; the
    # stdlib zoneinfo module isn't accepted as a substitute as of 1.4.x.
    "pytz>=2024.1",
    "pyyaml>=6.0.3",
    # OpenTelemetry SDK + HTTP OTLP log exporter. Ships structured logs
    # to PostHog Logs when POSTHOG_PROJECT_TOKEN is set. PostHog
    # terminates standard OTLP/HTTP at /i/v1/logs — no PostHog-specific
    # Python package exists.
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    # 1.42 deprecated opentelemetry.sdk._logs.LoggingHandler in favor of the
    # one shipped from opentelemetry-instrumentation-logging. Same API,
    # same wire behavior, just no DeprecationWarning at construction.
    # Ceiling is to bound surprise — the instrumentation contrib packages
    # have moved module paths across minor revs before (the handler lives
    # at opentelemetry.instrumentation.logging.handler today; that's NOT
    # the package's documented public surface — public is
    # LoggingInstrumentor — so a future rev could move it without a
    # deprecation cycle. Bump deliberately.
    "opentelemetry-instrumentation-logging>=0.50b0,<0.64",
]

[project.optional-dependencies]
msk-iam = ["aws-msk-iam-sasl-signer-python>=1.0.0"]

[project.scripts]
millpond = "millpond.main:run"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.8",
    "testcontainers>=4.14.2",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "e2e: marks tests as E2E tests requiring docker-compose stack",
    "slow: scale measurements that need gigabytes and minutes; opt in with MILLPOND_RUN_SCALE=1, never CI-gating",
]
pythonpath = ["tools"]
testpaths = ["tests"]
# Keep collection scoped to `tests/` only — local working clones (e.g.
# an untracked `lakekeeper/` source tree) carry their own tests/ whose
# deps we don't install.
norecursedirs = ["lakekeeper", ".venv", "node_modules"]

[tool.uv]
exclude-newer = "7 days"
# Cooldown carve-out for our own package pyhoglake: 1.3.7 was published 2026-10-01 and
# is needed now for `prepare_append_tables` (buffer encode + concurrent
# single-request uploads), the typed commit refusals that retire the
# per-flush table read, and `info(totals=False)`. Fixed date, not a
# rolling window — future pyhoglake releases re-enter the cooldown until
# this date is bumped alongside an intentional version bump. Bumped for
# 1.4.0, published 2026-10-21, for the `author` / `message` keywords on
# every DDL call. Bumped for 1.4.4, published 2026-10-23T03:19Z, for the
# parquet codec keywords and `parquet_write_options`. Bumped for 1.4.5,
# published 2026-10-23T19:48Z, for `deferred_stats=` and
# `IdlessFilesPresentError`. Bumped for 1.4.7, published
# 2026-10-24T03:11Z: 1.4.6 narrows `IdlessFilesPresentError`; 1.4.7 is
# a version bump. Bumped for 1.4.8, published 2026-11-06T01:14Z, for the
# VARIANT write path (`variant_on_invalid=` / `variant_report=` on
# `prepare_append_tables`, `columns_to_arrow_schema(variant="json")`).
# pyhoglake-variant-codec is the Rust codec behind the `variant-codec`
# extra; 0.1.0 was published 2026-11-03T12:14Z and the extra pins it
# exactly, so it needs its own carve-out from the 7-day cooldown.
exclude-newer-package = { pyhoglake = "2026-11-06T04:00:00Z", pyhoglake-variant-codec = "2026-11-03T13:00:00Z", certifi = "1 day" }
constraint-dependencies = [
    "pygments>=2.20.0",
    "requests>=2.33.0",
]
