# Standalone stack for the Arrow-IPC-on-Kafka experiment.
#
# Runs independently of the parent docker-compose.yaml. Host ports are shifted
# to avoid collisions so both stacks can run side-by-side during A/B comparisons.
#
#   Parent stack            | This stack
#   ------------------------|------------------------
#   postgres  5433:5432     | postgres  5434:5432
#   minio     9000:9000     | minio     9100:9000
#   minio     9001:9001     | minio     9101:9001
#   kafka     (no host port) | kafka     (no host port)
#
# Topic: test-events-arrow (8 partitions), separate from the parent `test-events`.

services:
  # --- Infrastructure ---

  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    volumes:
      # This compose file lives at experiments/arrow-payload/, so the parent
      # project's test/ directory is two levels up.
      - ../../test/kafka-server.properties:/opt/kafka/config/kraft/server.properties:ro
    environment:
      CLUSTER_ID: millpond-arrow-dev-cluster-001
      # Allow batched Arrow IPC payloads larger than the 1MB default. PostHog
      # events with full properties run ~2-5KB each; 1000-record batches push
      # 2-5MB. Mirror with `max.message.bytes` on the topic and the producer.
      KAFKA_CFG_MESSAGE_MAX_BYTES: "16777216"
      KAFKA_CFG_REPLICA_FETCH_MAX_BYTES: "16777216"
    command: >
      bash -c "
      /opt/kafka/bin/kafka-storage.sh format -t $$CLUSTER_ID -c /opt/kafka/config/kraft/server.properties --ignore-formatted &&
      /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties
      "
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9094
      interval: 5s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:17
    hostname: postgres
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: ducklake
      POSTGRES_PASSWORD: ducklake
      POSTGRES_DB: ducklake
    healthcheck:
      test: pg_isready -U ducklake -d ducklake
      interval: 2s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    hostname: minio
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    healthcheck:
      test: mc ready local
      interval: 2s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/ducklake &&
      mc anonymous set download local/ducklake
      "

  # --- Topic Setup ---

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic test-events-arrow --partitions 8 --replication-factor 1 --config max.message.bytes=16777216 &&
        echo "Waiting for consumer group coordinator..." &&
        for i in $(seq 1 20); do
          /opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server kafka:9094 --group millpond-arrow-events --describe >/dev/null 2>&1 && echo "Coordinator ready." && break
          echo "  attempt $i/20..."
          sleep 1
        done

  # --- Producer (Python + pyarrow) ---

  producer:
    build:
      # Build context is the repo root so the producer Dockerfile can pull in
      # test/producer.py helpers if it wants to. Dockerfile path is relative
      # to that context.
      context: ../..
      dockerfile: experiments/arrow-payload/Dockerfile.producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      KAFKA_TOPIC: test-events-arrow
      KAFKA_PARTITION_COUNT: "8"
      BATCH_SIZE: "1000"
      BATCHES_PER_SECOND: "10"
      TOTAL_BATCHES: "-1"

  # --- Consumer (C++ + librdkafka + Arrow + DuckDB) ---

  arrow-consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      KAFKA_TOPIC: test-events-arrow
      KAFKA_PARTITION_COUNT: "8"
      KAFKA_GROUP_ID: millpond-arrow-events
      DUCKLAKE_TABLE: events_arrow
      DUCKLAKE_DATA_PATH: s3://ducklake/data
      DUCKLAKE_RDS_HOST: postgres
      DUCKLAKE_RDS_PORT: "5432"
      DUCKLAKE_RDS_DATABASE: ducklake
      DUCKLAKE_RDS_USERNAME: ducklake
      DUCKLAKE_RDS_PASSWORD: ducklake
      DUCKLAKE_CONNECTION: ":memory:"
      DUCKDB_S3_ENDPOINT: minio:9000
      DUCKDB_S3_ACCESS_KEY_ID: minioadmin
      DUCKDB_S3_SECRET_ACCESS_KEY: minioadmin
      DUCKDB_S3_USE_SSL: "false"
      DUCKDB_S3_URL_STYLE: path
