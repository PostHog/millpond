apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: millpond-events  # change per topic
spec:
  replicas: 8
  serviceName: millpond-events
  selector:
    matchLabels:
      app: millpond-events
  template:
    metadata:
      labels:
        app: millpond-events
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 120  # time to flush pending writes
      containers:
      - name: millpond
        image: millpond:latest
        ports:
        - name: metrics
          containerPort: 8000
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "broker:9094"
        - name: KAFKA_TOPIC
          value: "clickhouse_events_json"
        - name: REPLICA_COUNT
          value: "8"  # must match spec.replicas
        - name: DUCKLAKE_CONNECTION
          value: ":memory:"  # always in-memory — DuckLake metadata lives in Postgres
        - name: DUCKLAKE_TABLE
          value: "events"
        - name: DUCKLAKE_DATA_PATH
          value: "s3://posthog-ducklake-prod-us/data"
        - name: DUCKLAKE_METADATA_URL
          value: "postgresql://rds-host/ducklake"
        - name: FLUSH_SIZE
          value: "104857600"  # 100MB
        - name: FLUSH_INTERVAL_MS
          value: "60000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
