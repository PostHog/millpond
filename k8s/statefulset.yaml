apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: millpond-events  # change per topic
  # wiz-scan: ResourceQuota and LimitRange are namespace-level policies (managed by platform team)
  # wiz-scan: serviceName references headless Service defined in service.yaml (clusterIP: None)
spec:
  replicas: 8
  serviceName: millpond-events
  selector:
    matchLabels:
      app: millpond-events
  template:
    metadata:
      labels:
        app: millpond-events
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120  # time to flush pending writes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: millpond-events
              topologyKey: kubernetes.io/hostname
      containers:
      - name: millpond
        image: ghcr.io/posthog/millpond:v0.0.0  # Helm sets the real tag
        ports:
        - name: metrics
          containerPort: 8000
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "broker:9094"
        - name: KAFKA_TOPIC
          value: "clickhouse_events_json"
        - name: REPLICA_COUNT
          value: "8"  # must match spec.replicas
        - name: DUCKLAKE_CONNECTION
          value: ":memory:"  # always in-memory — DuckLake metadata lives in Postgres
        - name: DUCKLAKE_TABLE
          value: "events"
        - name: DUCKLAKE_DATA_PATH
          value: "s3://posthog-ducklake-prod-us/data"
        - name: DUCKLAKE_METADATA_URL
          value: "postgresql://rds-host/ducklake"
        - name: FLUSH_SIZE
          value: "104857600"  # 100MB
        - name: FLUSH_INTERVAL_MS
          value: "60000"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp  # DuckDB spill-to-disk under memory pressure
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: tmp
        emptyDir: {}  # disk-backed, not RAM — spill shouldn't count against memory limit
